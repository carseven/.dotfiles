[project]
name = "running-coach-zepp"
version = "0.1.0"
description = "Local Zepp Life cache CLI for Running Coach"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "keyring>=25.0.0",
    "platformdirs>=4.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "respx>=0.21.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]