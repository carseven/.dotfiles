name: CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shfmt
        run: |
          curl -fsSL -o /tmp/shfmt https://github.com/mvdan/sh/releases/download/v3.12.0/shfmt_v3.12.0_linux_amd64
          echo "d9fbb2a9c33d13f47e7618cf362a914d029d02a6df124064fff04fd688a745ea  /tmp/shfmt" | sha256sum -c -
          sudo install -m 0755 /tmp/shfmt /usr/local/bin/shfmt
      - name: Check format with shfmt
        run: find . -type f -perm -111 -not -path './.git/*' -print0 | xargs -0 shfmt -i 4 -d
      - name: Check linting with shellcheck
        run: find . -type f -perm -111 -not -path './.git/*' -print0 | xargs -0 shellcheck -S error
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Smoke-test the runner without installing packages
        run: ./run --dry
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run shell behavior tests
        run: ./test